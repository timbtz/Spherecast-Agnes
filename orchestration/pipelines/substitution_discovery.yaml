name: substitution_discovery
trigger: chat
# US-07: Find functionally equivalent substitutes for an ingredient.
# Walks substitution graph, checks compliance, assesses BOM impact, drafts proposal.
# Fallback: if the substitution walker returns no rows, emit a grounded explanation
# instead of silently completing with no output.
nodes:
  - id: find-substitutes
    tool_class: SubstitutionWalkerTool
    depends_on: []

  - id: gate-compliance
    tool_class: ComplianceReasonerTool
    depends_on: [find-substitutes]
    when: has_substitutes

  - id: find-alternatives
    tool_class: SupplierAlternativesTool
    depends_on: [find-substitutes]
    when: has_substitutes

  - id: bom-impact
    tool_class: BomImpactTool
    depends_on: [find-substitutes]

  - id: benchmark-prices
    tool_class: PriceBenchmarkTool
    depends_on: [find-substitutes]
    when: has_substitutes

  - id: write-proposal
    agent_class: ProposalWriter
    depends_on: [gate-compliance, find-alternatives, bom-impact, benchmark-prices]
    when: has_substitutes

  - id: no-data-fallback
    tool_class: NoDataExplainerTool
    depends_on: [find-substitutes]
    when: no_substitutes_found
