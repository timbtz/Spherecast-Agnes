name: proactive_consolidation
trigger: data_update
# US-02: Proactive weekly/on-data-change consolidation scan.
# Ranks opportunities, maps BOM impact, generates executive proposals.
# Fallback: grounded explanation when no opportunities meet the threshold.
nodes:
  - id: scan-opportunities
    tool_class: OpportunityRankerTool
    depends_on: []

  - id: write-proposals
    agent_class: ProactiveAgent
    depends_on: [scan-opportunities]
    when: above_score_threshold

  - id: no-opportunity-fallback
    tool_class: NoOpportunityExplainerTool
    depends_on: [scan-opportunities]
    when: no_opportunities_found
