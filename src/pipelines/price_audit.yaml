name: price_audit
trigger: chat
# US-05: Benchmark prices for an ingredient, flag above-market suppliers,
# and identify consolidation opportunity if fragmentation is high.
nodes:
  - id: benchmark-prices
    tool_class: PriceBenchmarkTool
    depends_on: []

  - id: find-alternatives
    tool_class: SupplierAlternativesTool
    depends_on: [benchmark-prices]
    when: has_price_deviations

  - id: bom-impact
    tool_class: BomImpactTool
    depends_on: [benchmark-prices]

  - id: write-proposal
    agent_class: ProposalWriter
    depends_on: [benchmark-prices, find-alternatives, bom-impact]
    when: has_price_deviations
